
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Indicator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
        }

        .login {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0d6efd;
            font-weight: bold;
        }

        legend {
            color: #333333;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            padding: 10px;
        }

        .btn-primary {
            padding: 12px;
            font-weight: bold;
        }

        .alert {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container mt-5 mb-5">

        <div class="login">

            <!-- Page Heading -->
            <h1 class="text-center mb-4">
                Student Exam Performance Indicator
            </h1>

            <!-- Prediction Form -->
            <form
                action="{{ url_for('predict_datapoint') }}"
                method="post"
            >

                <h4 class="mb-4">
                    <legend>Student Exam Performance Prediction</legend>
                </h4>

                <!-- Gender -->
                <div class="mb-3">
                    <label for="gender" class="form-label">
                        Gender
                    </label>

                    <select
                        class="form-control"
                        id="gender"
                        name="gender"
                        required
                    >
                        <option selected disabled value="">
                            Select your Gender
                        </option>

                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Race or Ethnicity -->
                <div class="mb-3">
                    <label for="ethnicity" class="form-label">
                        Race or Ethnicity
                    </label>

                    <select
                        class="form-control"
                        id="ethnicity"
                        name="ethnicity"
                        required
                    >
                        <option selected disabled value="">
                            Select Ethnicity
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <!-- Parental Level of Education -->
                <div class="mb-3">
                    <label
                        for="parental_level_of_education"
                        class="form-label"
                    >
                        Parental Level of Education
                    </label>

                    <select
                        class="form-control"
                        id="parental_level_of_education"
                        name="parental_level_of_education"
                        required
                    >
                        <option selected disabled value="">
                            Select Parent Education
                        </option>

                        <option value="associate's degree">
                            Associate's degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's degree
                        </option>

                        <option value="high school">
                            High school
                        </option>

                        <option value="master's degree">
                            Master's degree
                        </option>

                        <option value="some college">
                            Some college
                        </option>

                        <option value="some high school">
                            Some high school
                        </option>
                    </select>
                </div>

                <!-- Lunch Type -->
                <div class="mb-3">
                    <label for="lunch" class="form-label">
                        Lunch Type
                    </label>

                    <select
                        class="form-control"
                        id="lunch"
                        name="lunch"
                        required
                    >
                        <option selected disabled value="">
                            Select Lunch Type
                        </option>

                        <option value="free/reduced">
                            Free/Reduced
                        </option>

                        <option value="standard">
                            Standard
                        </option>
                    </select>
                </div>

                <!-- Test Preparation Course -->
                <div class="mb-3">
                    <label
                        for="test_preparation_course"
                        class="form-label"
                    >
                        Test Preparation Course
                    </label>

                    <select
                        class="form-control"
                        id="test_preparation_course"
                        name="test_preparation_course"
                        required
                    >
                        <option selected disabled value="">
                            Select Test Preparation Course
                        </option>

                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <!-- Reading Score -->
                <div class="mb-3">
                    <label for="reading_score" class="form-label">
                        Reading Score
                    </label>

                    <input
                        class="form-control"
                        id="reading_score"
                        type="number"
                        name="reading_score"
                        placeholder="Enter your Reading Score"
                        min="0"
                        max="100"
                        step="1"
                        required
                    >
                </div>

                <!-- Writing Score -->
                <div class="mb-3">
                    <label for="writing_score" class="form-label">
                        Writing Score
                    </label>

                    <input
                        class="form-control"
                        id="writing_score"
                        type="number"
                        name="writing_score"
                        placeholder="Enter your Writing Score"
                        min="0"
                        max="100"
                        step="1"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <div class="d-grid mb-3">
                    <input
                        class="btn btn-primary"
                        type="submit"
                        value="Predict Math Score"
                    >
                </div>

            </form>

            <!-- Prediction Result -->
            {% if results is defined %}
                <div class="alert alert-success mt-4" role="alert">

                    <h4 class="alert-heading">
                        Prediction Result
                    </h4>

                    <hr>

                    <p class="mb-0">
                        The predicted mathematics score is:
                        <strong>{{results}}</strong>
                    </p>

                </div>
            {% endif %}

        </div>

    </div>

    <!-- Bootstrap JavaScript (optional) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
